proxy-groups:
- name: 负载均衡
  type: load-balance
  url: https://www.gstatic.com/generate_204
  interval: 300
  strategy: round-robin
  proxies:
    - vless-reality-vision-ser900471152131                              
    - vmess-ws-ser900471152131
    - hysteria2-ser900471152131
    - tuic5-ser900471152131
    - anytls-ser900471152131

- name: 自动选择
  type: url-test
  url: https://www.gstatic.com/generate_204
  interval: 300
  tolerance: 50
  proxies:
    - vless-reality-vision-ser900471152131                              
    - vmess-ws-ser900471152131
    - hysteria2-ser900471152131
    - tuic5-ser900471152131
    - anytls-ser900471152131
    
- name: 🌍选择代理节点
  type: select
  proxies:
    - 负载均衡                                         
    - 自动选择
    - DIRECT
    - vless-reality-vision-ser900471152131                              
    - vmess-ws-ser900471152131
    - hysteria2-ser900471152131
    - tuic5-ser900471152131
    - anytls-ser900471152131
rules:
  - GEOIP,LAN,DIRECT
  - GEOSITE,CN,DIRECT
  - GEOIP,CN,DIRECT
  - MATCH,🌍选择代理节点
