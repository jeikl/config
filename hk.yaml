    - vmess-ws-ser210691770364
    - hysteria2-ser210691770364
    - tuic5-ser210691770364
    - anytls-ser210691770364

- name: 自动选择
  type: url-test
  url: https://www.gstatic.com/generate_204
  interval: 300
  tolerance: 50
  proxies:
    - vless-reality-vision-ser210691770364                              
    - vmess-ws-ser210691770364
    - hysteria2-ser210691770364
    - tuic5-ser210691770364
    - anytls-ser210691770364
    
- name: 🌍选择代理节点
  type: select
  proxies:
    - 负载均衡                                         
    - 自动选择
    - DIRECT
    - vless-reality-vision-ser210691770364                              
    - vmess-ws-ser210691770364
    - hysteria2-ser210691770364
    - tuic5-ser210691770364
    - anytls-ser210691770364
rules:
