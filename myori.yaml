mixed-port: 7890
ipv6: true
allow-lan: false
bind-address: "*"
mode: rule
log-level: info
external-controller: 127.0.0.1:9090
unified-delay: true
tcp-concurrent: true

dns:
  enable: true
  ipv6: true
  respect-rules: true
  default-nameserver: [119.29.29.29, 114.114.114.114]
  proxy-server-nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
    - tls://dot.pub
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter: ['*.lan', localhost.ptlogin2.qq.com]
  use-hosts: true
  nameserver:
    - https://doh.pub/dns-query
    - tls://dot.pub
    - https://223.5.5.5/dns-query
    - https://223.6.6.6/dns-query
    - tls://dns.alidns.com
  fallback:
    - https://doh.pub/dns-query
    - tls://dot.pub
    - https://223.5.5.5/dns-query
    - https://223.6.6.6/dns-query
    - tls://dns.alidns.com
  fallback-filter:
    geoip: true
    ipcidr: [240.0.0.0/4, 0.0.0.0/32]

