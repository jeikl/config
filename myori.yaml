mixed-port: 7890
ipv6: true
allow-lan: false
bind-address: "*"
mode: rule
log-level: info
external-controller: 127.0.0.1:9090
unified-delay: true
tcp-concurrent: true

dns:
  enable: true
  ipv6: true
  respect-rules: true
  default-nameserver: [119.29.29.29, 114.114.114.114]
  proxy-server-nameserver:
    - 1.1.1.1
    - 8.8.8.8
  enhanced-mode: redir-host              # 切换为真实 IP 模式
  use-hosts: true
  nameserver-policy:
    '+.et.net': 100.100.100.101          # et.net 继续指定 100.100.100.101 解析
  nameserver:
    - 114.114.114.114
    - 223.5.5.5
  fallback:
    - 1.1.1.1
    - 8.8.8.8
  fallback-filter:
    geoip: true
    ipcidr: [240.0.0.0/4, 0.0.0.0/32]

# ╔══════════════════════════════════════╗
# ║          手动代理节点                ║
# ╚══════════════════════════════════════╝
proxies:
  # ── cloudflare ──────────────────────────────
  - name: "cloudflare"
    type: vless
    server: cd5ee671.ti-ewg.pages.dev
    port: 443
    uuid: c25ae7e1-1841-4de8-8082-d2a9be361bcb
    udp: true
    tls: true
    sni: cd5ee671.ti-ewg.pages.dev
    client-fingerprint: chrome
    network: ws
    ws-opts:
      path: /
      headers:
        Host: cd5ee671.ti-ewg.pages.dev

  # ── 香港 ──────────────────────────────



  # ── 日本 ──────────────────────────────


  # ── 新加坡 ────────────────────────────






# ╔══════════════════════════════════════╗
# ║          订阅节点来源                ║
# ╚══════════════════════════════════════╝
proxy-providers:


  良心云:
    type: http
    url: "https://liangxin.xyz/api/v1/liangxin?OwO=456e0417072210b657399d619b043749"
    interval: 86400
    path: ./providers/liangxin.yaml
    filter: "^(?!.*(剩余|到期|套餐|流量|官网|平台|v6))"   # 过滤掉信息节点
    health-check:
      enable: true
      url: http://www.gstatic.com/generate_204
      interval: 30




  私人:
    type: http
    url: "https://v6.gh-proxy.org/https://raw.githubusercontent.com/jeikl/config/refs/heads/main/usla.yaml"
    interval: 3600
    path: ./providers/usla.yaml
    health-check:
      enable: true
      url: http://www.gstatic.com/generate_204
      interval: 300


# ╔══════════════════════════════════════╗
# ║             代理组                   ║
# ╚══════════════════════════════════════╝
proxy-groups:

  # ┌─────────────────────────────────────
  # │  顶层选择组（手动切换入口）
  # └─────────────────────────────────────

  - name: PROXY
    type: select
    proxies:
      - 自动选择
      - cloudflare
      - 香港自动
      - 非香港自动
      - DIRECT
      # 手动节点（香港）
      # 手动节点（日本）


      # 手动节点（新加坡）

      # 手动节点（美国）
      - 私人
      # 订阅节点组
      - 良心云
      - 良心云-香港
      - 良心云-非香港




  - name: AI                   # AI 服务专用
    type: select
    proxies:
      - 非香港自动
      - 良心云
      - 良心云-非香港
      - 私人




  - name: gemini                   # AI 服务专用
    type: select
    proxies:
      - 非香港自动
      - 良心云
      - 良心云-非香港
      - 私人


  # ┌─────────────────────────────────────
  # │  聚合自动组（香港 / 非香港）
  # └─────────────────────────────────────

  - name: 香港自动
    type: url-test
    proxies:
      - 良心云-香港


    url: http://www.gstatic.com/generate_204
    interval: 3
    timeout: 1500
    tolerance: 60

  - name: 非香港自动
    type: url-test
    proxies:
      - 私人
      - 良心云-非香港
    url: http://www.gstatic.com/generate_204
    interval: 3
    timeout: 2500
    tolerance: 50

  - name: 自动选择
    type: url-test
    proxies:
      - 香港自动
      - 非香港自动
    url: http://www.gstatic.com/generate_204
    interval: 3
    timeout: 2000
    tolerance: 50

  # ┌─────────────────────────────────────
  # │  现有机场手动全量组
  # └─────────────────────────────────────



  - name: 良心云
    type: select
    use: [良心云]

  - name: 良心云-香港
    type: url-test
    use: [良心云]
    filter: "(?i)港|hk|hongkong|hong.kong"
    url: http://www.gstatic.com/generate_204
    interval: 3
    timeout: 1500
    tolerance: 60

  - name: 良心云-非香港
    type: url-test
    use: [良心云]
    filter: "(?i)日|jp|japan|新加坡|sg|singapore|美|us|united.states|韩|kr|korea|台|tw|taiwan"
    url: http://www.gstatic.com/generate_204
    interval: 3
    timeout: 2500
    tolerance: 80











  - name: 私人
    type: select
    use: [私人]

  # ┌─────────────────────────────────────
  # │  功能性组
  # └─────────────────────────────────────

  # - name: 中转
  #   type: url-test
  #   proxies:
  #   url: http://www.gstatic.com/generate_204
  #   interval: 3
  #   timeout: 1500
  #   tolerance: 25


