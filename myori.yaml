# ╔══════════════════════════════════════╗
# ║             代理组                   ║
# ╚══════════════════════════════════════╝
proxy-groups:

  # ┌─────────────────────────────────────
  # │  顶层选择组（手动切换入口）
  # └─────────────────────────────────────

  - name: PROXY
    type: select
    proxies:
      - 自动选择
      - cloudflare
      # 自购订阅源（直接单选自购服务器）
      - 自购
      - 香港转自购
      - 香港自动
      - 非香港自动
      - DIRECT
      # 手动节点（香港）
      - 香港 01 HKIX
      - 香港 02 HKIX
      # 手动节点（日本）
      - 日本 02 SoftBank
      - 日本 05 SoftBank
      - 爪云-JP-WS
      # 手动节点（新加坡）
      - 新加坡 04 Singtel
      - 新加坡 05 Singtel
      # 其他
      - 老家hy
      # 订阅节点组
      - 良心云
      - 良心云-香港
      - 良心云-非香港
      - 飞鸟云
      - 飞鸟云-香港
      - 飞鸟云-非香港
      - 小火箭
      - 小火箭-香港
      - 小火箭-非香港

  - name: AI                   # AI 服务专用
    type: select
    proxies:
      - 非香港自动
      - 良心云
      - 自购                     # 直接引入自购节点（确保你这台自购服务器不是香港IP即可）
      - 良心云-非香港
      - 飞鸟云-非香港
      - 小火箭-非香港
      - 日本 02 SoftBank
      - 日本 05 SoftBank
      - 爪云-JP-WS
      - 新加坡 04 Singtel
      - 新加坡 05 Singtel
      - 香港转自购

  # ┌─────────────────────────────────────
  # │  聚合自动组（香港 / 非香港）
  # └─────────────────────────────────────

  - name: 香港自动
    type: url-test
    proxies:
      - 香港 01 HKIX
      - 香港 02 HKIX
      - 良心云-香港
      - 飞鸟云-香港
      - 小火箭-香港
    url: http://www.gstatic.com/generate_204
    interval: 3
    timeout: 1500
    tolerance: 60

  - name: 非香港自动
    type: url-test
    proxies:
      - 自购
      - 日本 02 SoftBank
      - 日本 05 SoftBank
      - 爪云-JP-WS
      - 新加坡 04 Singtel
      - 新加坡 05 Singtel
      - 良心云-非香港
      - 飞鸟云-非香港
      - 小火箭-非香港
    url: http://www.gstatic.com/generate_204
    interval: 3
    timeout: 2500
    tolerance: 50

  - name: 自动选择
    type: url-test
    proxies:
      - 香港自动
      - 非香港自动
    url: http://www.gstatic.com/generate_204
    interval: 3
    timeout: 2000
    tolerance: 50

  # ┌─────────────────────────────────────
  # │  现有机场手动全量组
  # └─────────────────────────────────────

  - name: 自购
    type: select
    use: [自购]

  - name: 良心云
    type: select
    use: [良心云]

  - name: 良心云-香港
    type: url-test
    use: [良心云]
    filter: "(?i)港|hk|hongkong|hong.kong"
    url: http://www.gstatic.com/generate_204
    interval: 3
    timeout: 1500
    tolerance: 60

  - name: 良心云-非香港
    type: url-test
    use: [良心云]
    filter: "(?i)日|jp|japan|新加坡|sg|singapore|美|us|united.states|韩|kr|korea|台|tw|taiwan"
    url: http://www.gstatic.com/generate_204
    interval: 3
    timeout: 2500
    tolerance: 80

  - name: 飞鸟云
    type: select
    use: [飞鸟云]

  - name: 飞鸟云-香港
    type: url-test
    use: [飞鸟云]
    filter: "(?i)港|hk|hongkong|hong.kong"
    url: http://www.gstatic.com/generate_204
    interval: 3
    timeout: 1500
    tolerance: 60

  - name: 飞鸟云-非香港
    type: url-test
    use: [飞鸟云]
    filter: "(?i)日|jp|japan|新加坡|sg|singapore|美|us|united.states|韩|kr|korea|台|tw|taiwan"
    url: http://www.gstatic.com/generate_204
    interval: 3
    timeout: 2500
    tolerance: 80

  - name: 小火箭
    type: select
    use: [小火箭]

  - name: 小火箭-香港
    type: url-test
    use: [小火箭]
    filter: "(?i)^(?!.*V6)(?!.*v6).*(港|hk|hongkong|hong.kong)"
    url: http://www.gstatic.com/generate_204
    interval: 3
    timeout: 1500
    tolerance: 60

  - name: 小火箭-非香港
    type: url-test
    use: [小火箭]
    filter: "(?i)^(?!.*V6)(?!.*v6).*(日|jp|japan|新加坡|sg|singapore|美|us|united.states|韩|kr|korea|台|tw|taiwan)"
    url: http://www.gstatic.com/generate_204
    interval: 3
    timeout: 2500
    tolerance: 80

  # ┌─────────────────────────────────────
  # │  功能性组
  # └─────────────────────────────────────

  - name: 中转
    type: url-test
    proxies:
      - 香港 01 HKIX
      - 香港 02 HKIX
      - 自购                     # 自购单节点也作为备用跳板参与中转
      - 飞鸟云-香港
      - 小火箭-香港
    url: http://www.gstatic.com/generate_204
    interval: 3
    timeout: 1500
    tolerance: 25


