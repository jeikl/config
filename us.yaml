port: 7890
allow-lan: true
mode: rule
log-level: info
unified-delay: true
dns:
  enable: true 
  listen: "0.0.0.0:1053"
  ipv6: true
  prefer-h3: false
  respect-rules: true
  use-system-hosts: false
  cache-algorithm: "arc"
  enhanced-mode: "fake-ip"
  fake-ip-range: "198.18.0.1/16"
  fake-ip-filter:
    - "+.lan"
    - "+.local"
    - "+.msftconnecttest.com"
    - "+.msftncsi.com"
    - "localhost.ptlogin2.qq.com"
    - "localhost.sec.qq.com"
    - "+.in-addr.arpa"
    - "+.ip6.arpa"
    - "time.*.com"
    - "time.*.gov"
    - "pool.ntp.org"
    - "localhost.work.weixin.qq.com"
  default-nameserver: ["223.5.5.5", "119.29.29.29"]
  nameserver:
    - "https://1.1.1.1/dns-query"
    - "https://8.8.8.8/dns-query"
  proxy-server-nameserver:
    - "https://223.5.5.5/dns-query"
    - "https://doh.pub/dns-query"

proxies:
- name: vless-reality-vision-uscn2               
  type: vless
  server: 179.253.249.49                           
  port: 41392                                
  uuid: 47e5e6c1-7228-402d-8df9-fa01b1010ba0   
  network: tcp
  udp: true
  tls: true
  flow: xtls-rprx-vision
  servername: apple.com                 
  reality-opts: 
    public-key: LOUa3SbB3M-pcOZTl5-Bei8gJRIiagR35arRnxNmFic    
    short-id: 77f82e43                      
  client-fingerprint: chrome                  

- name: vmess-ws-uscn2                         
  type: vmess
  server: 179.253.249.49                        
  port: 2082                                     
  uuid: 47e5e6c1-7228-402d-8df9-fa01b1010ba0       
  alterId: 0
  cipher: auto
  udp: true
  tls: false
  network: ws
  servername: www.bing.com                    
  ws-opts:
    path: "47e5e6c1-7228-402d-8df9-fa01b1010ba0-vm"                             
    headers:
      Host: www.bing.com                     

- name: hysteria2-uscn2                            
  type: hysteria2                                      
  server: 179.253.249.49                               
  port: 40232
  ports: 
  password: 47e5e6c1-7228-402d-8df9-fa01b1010ba0                          
  alpn:
    - h3
  sni: www.bing.com                               
  skip-cert-verify: true
  fast-open: true

- name: tuic5-uscn2                            
  server: 179.253.249.49                      
  port: 33076                                    
  type: tuic
  uuid: 47e5e6c1-7228-402d-8df9-fa01b1010ba0       
  password: 47e5e6c1-7228-402d-8df9-fa01b1010ba0   
  alpn: [h3]
  disable-sni: true
  reduce-rtt: true
  udp-relay-mode: native
  congestion-controller: bbr
  sni: www.bing.com                                
  skip-cert-verify: true

- name: anytls-uscn2
  type: anytls
  server: 179.253.249.49
  port: 14024
  password: 47e5e6c1-7228-402d-8df9-fa01b1010ba0
  client-fingerprint: chrome
  udp: true
  idle-session-check-interval: 30
  idle-session-timeout: 30
  sni: www.bing.com
  skip-cert-verify: true

proxy-groups:
- name: 负载均衡
  type: load-balance
  url: https://www.gstatic.com/generate_204
  interval: 300
  strategy: round-robin
  proxies:
    - vless-reality-vision-uscn2                              
    - vmess-ws-uscn2
    - hysteria2-uscn2
    - tuic5-uscn2
    - anytls-uscn2

- name: 自动选择
  type: url-test
  url: https://www.gstatic.com/generate_204
  interval: 300
  tolerance: 50
  proxies:
    - vless-reality-vision-uscn2                              
    - vmess-ws-uscn2
    - hysteria2-uscn2
    - tuic5-uscn2
    - anytls-uscn2
    
- name: 🌍选择代理节点
  type: select
  proxies:
    - 负载均衡                                         
    - 自动选择
    - DIRECT
    - vless-reality-vision-uscn2                              
    - vmess-ws-uscn2
    - hysteria2-uscn2
    - tuic5-uscn2
    - anytls-uscn2
rules:
  - GEOIP,LAN,DIRECT
  - GEOSITE,CN,DIRECT
  - GEOIP,CN,DIRECT
  - MATCH,🌍选择代理节点