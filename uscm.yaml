port: 7890
allow-lan: true
mode: rule
log-level: info
unified-delay: true
dns:
  enable: true 
  listen: "0.0.0.0:1053"
  ipv6: true
  prefer-h3: false
  respect-rules: true
  use-system-hosts: false
  cache-algorithm: "arc"
  enhanced-mode: "fake-ip"
  fake-ip-range: "198.18.0.1/16"
  fake-ip-filter:
    - "+.lan"
    - "+.local"
    - "+.msftconnecttest.com"
    - "+.msftncsi.com"
    - "localhost.ptlogin2.qq.com"
    - "localhost.sec.qq.com"
    - "+.in-addr.arpa"
    - "+.ip6.arpa"
    - "time.*.com"
    - "time.*.gov"
    - "pool.ntp.org"
    - "localhost.work.weixin.qq.com"
  default-nameserver: ["223.5.5.5", "119.29.29.29"]
  nameserver:
    - "https://1.1.1.1/dns-query"
    - "https://8.8.8.8/dns-query"
  proxy-server-nameserver:
    - "https://223.5.5.5/dns-query"
    - "https://doh.pub/dns-query"

proxies:
- name: vless-reality-vision-uscm               
  type: vless
  server: 179.255.149.108                           
  port: 14212                                
  uuid: 807110cd-ea0a-4a9e-9881-4068d39770b0   
  network: tcp
  udp: true
  tls: true
  flow: xtls-rprx-vision
  servername: apple.com                 
  reality-opts: 
    public-key: fwFFZnEp0OGiinZ0MhpFpI_5YaYGQLduigh_wxasyxs    
    short-id: b4059b8c                      
  client-fingerprint: chrome                  

- name: vmess-ws-uscm                         
  type: vmess
  server: 179.255.149.108                        
  port: 2086                                     
  uuid: 807110cd-ea0a-4a9e-9881-4068d39770b0       
  alterId: 0
  cipher: auto
  udp: true
  tls: false
  network: ws
  servername: www.bing.com                    
  ws-opts:
    path: "807110cd-ea0a-4a9e-9881-4068d39770b0-vm"                             
    headers:
      Host: www.bing.com                     

- name: hysteria2-uscm                            
  type: hysteria2                                      
  server: 179.255.149.108                               
  port: 35453
  ports: 
  password: 807110cd-ea0a-4a9e-9881-4068d39770b0                          
  alpn:
    - h3
  sni: www.bing.com                               
  skip-cert-verify: true
  fast-open: true

- name: tuic5-uscm                            
  server: 179.255.149.108                      
  port: 61174                                    
  type: tuic
  uuid: 807110cd-ea0a-4a9e-9881-4068d39770b0       
  password: 807110cd-ea0a-4a9e-9881-4068d39770b0   
  alpn: [h3]
  disable-sni: true
  reduce-rtt: true
  udp-relay-mode: native
  congestion-controller: bbr
  sni: www.bing.com                                
  skip-cert-verify: true

- name: anytls-uscm
  type: anytls
  server: 179.255.149.108
  port: 19188
  password: 807110cd-ea0a-4a9e-9881-4068d39770b0
  client-fingerprint: chrome
  udp: true
  idle-session-check-interval: 30
  idle-session-timeout: 30
  sni: www.bing.com
  skip-cert-verify: true

proxy-groups:
- name: 负载均衡
  type: load-balance
  url: https://www.gstatic.com/generate_204
  interval: 300
  strategy: round-robin
  proxies:
    - vless-reality-vision-uscm                              
    - vmess-ws-uscm
    - hysteria2-uscm
    - tuic5-uscm
    - anytls-uscm

- name: 自动选择
  type: url-test
  url: https://www.gstatic.com/generate_204
  interval: 300
  tolerance: 50
  proxies:
    - vless-reality-vision-uscm                              
    - vmess-ws-uscm
    - hysteria2-uscm
    - tuic5-uscm
    - anytls-uscm
    
- name: 🌍选择代理节点
  type: select
  proxies:
    - 负载均衡                                         
    - 自动选择
    - DIRECT
    - vless-reality-vision-uscm                              
    - vmess-ws-uscm
    - hysteria2-uscm
    - tuic5-uscm
    - anytls-uscm
rules:
  - GEOIP,LAN,DIRECT
  - GEOSITE,CN,DIRECT
  - GEOIP,CN,DIRECT
  - MATCH,🌍选择代理节点